[project]
name = "asana-cli"
version = "0.1.0"
description = "Thin CLI over the Asana REST API for task CRUD (list/get/create/update)"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
asana = "asana_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asana_cli"]
